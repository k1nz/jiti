name: RC Build

# Internal RC builds. Signed with a self-signed certificate so that
# Accessibility grants survive upgrades; not notarized, so recipients approve
# the app once in System Settings > Privacy & Security.
# Tag pushes also publish a GitHub prerelease so the website can offer RC
# installers until a stable release exists. workflow_dispatch stays artifacts-only.
#
# Required repository secrets (macOS legs):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD
# The certificate must be the same one used for local builds, or a machine that
# installs both would have its Accessibility grant invalidated by the other.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.5.0-rc.*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::error::APPLE_CERTIFICATE is not set. The build would fall back to ad-hoc signing and silently break every recipient's Accessibility grant on the next upgrade. Add the three signing secrets before tagging."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/jiti-local-dev.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must match the certificate above. Overrides the bundle.macOS.signingIdentity
          # in tauri.conf.json, which names the same identity on a developer machine.
          APPLE_SIGNING_IDENTITY: "Jiti Local Dev"
        with:
          projectPath: packages/native
          args: ${{ matrix.args }}
          includeUpdaterJson: false
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Jiti __VERSION__
          releaseDraft: false
          prerelease: true
      - name: Reject an ad-hoc package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find packages/native/target -name 'Jiti.app' -type d | head -n 1)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          requirement=$(codesign -d -r- "$APP" 2>&1 | tail -n 1)
          echo "$requirement"
          if [[ "$requirement" == *cdhash* ]]; then
            echo "::error::$APP is ad-hoc signed, so every recipient's Accessibility grant would break on the next upgrade."
            exit 1
          fi
      - name: SHA-256
        shell: bash
        run: |
          mkdir -p checksums
          out="checksums/${{ matrix.name }}.sha256"
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] && files+=("$f")
          done < <(
            find packages/native/target -path '*/bundle/*' -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
              | sort -u
          )
          if ((${#files[@]} == 0)); then
            echo "No installer artifacts found under packages/native/target/**/bundle"
            : > "$out"
            exit 0
          fi
          if command -v shasum >/dev/null; then
            shasum -a 256 "${files[@]}" | tee "$out"
          else
            sha256sum "${files[@]}" | tee "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jiti-${{ github.ref_name }}-${{ matrix.name }}
          path: |
            packages/native/target/**/bundle/**
            checksums/**
          if-no-files-found: warn
          retention-days: 14
