name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'design-system/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'design-system/**'

jobs:
  gate:
    name: versions / ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm ui:typecheck
      - run: pnpm ui:test
      - run: pnpm ui:build
      - name: no sourcemaps in dist
        run: |
          if find packages/ui/dist -name '*.map' | grep -q .; then
            echo "sourcemap leaked into dist"
            find packages/ui/dist -name '*.map'
            exit 1
          fi

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config
      - name: fmt
        run: cargo fmt --manifest-path packages/native/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path packages/native/Cargo.toml --all-targets
      - name: test (exports specta bindings)
        run: cargo test --manifest-path packages/native/Cargo.toml
